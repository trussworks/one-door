services:
  migrate:
    image: ${ONE_DOOR_IMAGE:-one-door:local}
    build: .
    command: ["node", "--experimental-strip-types", "scripts/db-migrate.ts"]
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL for the app database}
    restart: "no"

  web:
    image: ${ONE_DOOR_IMAGE:-one-door:local}
    init: true
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL for the app database}
      DEMO_ACCESS_CODE: ${DEMO_ACCESS_CODE:?Set a private demo access code}
      SESSION_SECRET: ${SESSION_SECRET:?Set a separate random signing secret}
      APP_ORIGIN: ${APP_ORIGIN:?Set the browser-facing origin}
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  worker:
    image: ${ONE_DOOR_IMAGE:-one-door:local}
    init: true
    command: ["node", "--experimental-strip-types", "scripts/model-worker.ts"]
    restart: unless-stopped
    stop_grace_period: 2m
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL for the app database}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:?Set runtime Anthropic credentials}
