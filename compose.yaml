services:
  postgres:
    image: postgres:18.6
    container_name: one-door-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-one_door}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the local environment.}
      POSTGRES_DB: one_door
      # Deterministic collation, so ORDER BY matches between machines and CI.
      POSTGRES_INITDB_ARGS: "--locale=C --encoding=UTF8"
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - one_door_pgdata:/var/lib/postgresql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-one_door} -d ${POSTGRES_DB:-one_door}",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  one_door_pgdata:
