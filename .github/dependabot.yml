version: 2
updates:
  # Weekly, capped, and never merged automatically: an update to the running
  # demo has to be reviewed and released like any other change.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 1
    groups:
      npm-dependencies:
        patterns: ["*"]
    versioning-strategy: increase
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 1
    groups:
      container-images:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 1
    groups:
      workflow-actions:
        patterns: ["*"]
