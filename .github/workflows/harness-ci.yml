# Generated by repo-harness — a plain GitHub Actions workflow with no dependency
# on harness itself. Edit freely inside a job; harness replaces only the block
# between its own job markers, and never touches a workflow it did not write.
name: Harness CI

# Checks run inside the manually dispatched release so the launch consumes
# one workflow run, without separate pull-request or push-triggered runs.
on:
  workflow_call:

# Least privilege: these checks only read the checked-out code. Without this
# block the job inherits the repository/organization default, which on older
# repos is still read+write on contents, packages, issues and pull requests.
permissions:
  contents: read

jobs:
  credentials:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Fetch checkpoint history
        env:
          GH_TOKEN: ${{ github.token }}
        run: git -c credential.helper= -c 'credential.helper=!gh auth git-credential' fetch origin '+refs/entire/checkpoints/*:refs/entire/checkpoints/*'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run security
      - run: npm run security:history

  # harness:job:node
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"
          cache: npm

      - run: npm ci

      - name: format:check
        run: npm run format:check

      - name: lint
        run: npm run lint

      - name: typecheck
        run: npm run typecheck

      - name: test
        run: npm run test

      - name: build
        run: npm run build

      - name: security
        run: npm run security

      - name: audit
        run: npm audit --audit-level=high
  # harness:job:node:end

  database:
    runs-on: ubuntu-latest
    steps:
      - id: db
        run: |
          password="$(openssl rand -hex 24)"
          echo "::add-mask::$password"
          echo "DATABASE_URL=postgresql://one_door:$password@localhost:5432/one_door" >> "$GITHUB_ENV"
          docker run -d --name postgres -p 5432:5432 \
            -e POSTGRES_USER=one_door \
            -e POSTGRES_PASSWORD="$password" \
            -e POSTGRES_DB=one_door \
            -e POSTGRES_INITDB_ARGS="--locale=C --encoding=UTF8" \
            postgres:18.6
          for _attempt in $(seq 1 30); do
            docker exec postgres pg_isready -U one_door -d one_door && exit 0
            sleep 2
          done
          exit 1

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"
          cache: npm

      - run: npm ci
      - run: npm run test:db
      - run: npm run test:fixtures
      - run: npm run test:workflow
      - run: npm run test:review
      - run: npm run test:api

  isolated-workflows:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        suite:
          [
            intake,
            model,
            catalog,
            reset,
            read-model,
            review-corrections,
            delivery-lineage,
            cache-currency,
            requester-fit,
            intake-workspace,
            admin-notes,
            lifecycle-fixtures,
            fixture-upgrade,
            upgrade-lifecycle,
            bootstrap,
            inspect,
            priority,
            review-inputs,
            review-submission,
            requester-priority,
            review-input-queue,
          ]
        # Suites that demand their own database name get one; the rest use
        # the shared default. Each matrix job runs a fresh database container.
        include:
          - suite: admin-notes
            database: one_door_admin_notes
          - suite: lifecycle-fixtures
            database: one_door_lifecycle
          - suite: fixture-upgrade
            database: one_door_fixup
          - suite: upgrade-lifecycle
            database: one_door_upgrade_lifecycle
          - suite: review-inputs
            database: one_door_review_inputs_ci
          - suite: review-input-queue
            database: one_door_review_inputs_ci
    steps:
      - id: db
        env:
          DATABASE_NAME: ${{ matrix.database || 'one_door' }}
        run: |
          password="$(openssl rand -hex 24)"
          echo "::add-mask::$password"
          echo "DATABASE_URL=postgresql://one_door:$password@localhost:25432/$DATABASE_NAME" >> "$GITHUB_ENV"
          docker run -d --name postgres -p 25432:5432 \
            -e POSTGRES_USER=one_door \
            -e POSTGRES_PASSWORD="$password" \
            -e POSTGRES_DB="$DATABASE_NAME" \
            -e POSTGRES_INITDB_ARGS="--locale=C --encoding=UTF8" \
            postgres:18.6
          for _attempt in $(seq 1 30); do
            docker exec postgres pg_isready -U one_door -d "$DATABASE_NAME" && exit 0
            sleep 2
          done
          exit 1

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run test:${{ matrix.suite }}

  browser:
    runs-on: ubuntu-latest
    steps:
      - id: db
        run: |
          password="$(openssl rand -hex 24)"
          echo "::add-mask::$password"
          echo "E2E_DATABASE_URL=postgresql://one_door:$password@localhost:5432/one_door_e2e" >> "$GITHUB_ENV"
          docker run -d --name postgres -p 5432:5432 \
            -e POSTGRES_USER=one_door \
            -e POSTGRES_PASSWORD="$password" \
            -e POSTGRES_DB=one_door_e2e \
            -e POSTGRES_INITDB_ARGS="--locale=C --encoding=UTF8" \
            postgres:18.6
          for _attempt in $(seq 1 30); do
            docker exec postgres pg_isready -U one_door -d one_door_e2e && exit 0
            sleep 2
          done
          exit 1

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:browser
      - name: Retain accessibility reports
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: accessibility-reports
          path: playwright-results/**/*-accessibility.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: failure()
        with:
          name: browser-failures
          path: playwright-results

  container:
    runs-on: ubuntu-latest
    steps:
      # The image test and the shutdown test need different database names on
      # one server, so only the generated password reaches the environment and
      # each step builds its own URL from it.
      - id: db
        run: |
          password="$(openssl rand -hex 24)"
          echo "::add-mask::$password"
          echo "LOCAL_DATABASE_PASSWORD=$password" >> "$GITHUB_ENV"
          docker run -d --name postgres -p 25432:5432 \
            --add-host host.docker.internal:host-gateway \
            -e POSTGRES_USER=one_door \
            -e POSTGRES_PASSWORD="$password" \
            -e POSTGRES_DB=one_door_container \
            -e POSTGRES_INITDB_ARGS="--locale=C --encoding=UTF8" \
            postgres:18.6
          for _attempt in $(seq 1 30); do
            docker exec postgres pg_isready -U one_door -d one_door_container && exit 0
            sleep 2
          done
          exit 1

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: |
          docker build --tag one-door:local \
            --build-arg SOURCE_REVISION=${{ github.sha }} \
            --build-arg SOURCE_URL=${{ github.server_url }}/${{ github.repository }} \
            --build-arg RELEASE_ID=ci-${{ github.run_id }}-${{ github.run_attempt }} .
      - run: npm run test:container
        env:
          # The env context is available at step scope, not jobs.<id>.env.
          CONTAINER_DATABASE_URL: postgresql://one_door:${{ env.LOCAL_DATABASE_PASSWORD }}@host.docker.internal:25432/one_door_container
          SOURCE_REVISION: ${{ github.sha }}
          SOURCE_URL: ${{ github.server_url }}/${{ github.repository }}
          RELEASE_ID: ci-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Create an isolated shutdown-check database
        run: docker exec postgres createdb -U one_door one_door_shutdown
      - run: npm run test:worker-shutdown
        env:
          ONE_DOOR_IMAGE: one-door:local
          DATABASE_URL: postgresql://one_door:${{ env.LOCAL_DATABASE_PASSWORD }}@localhost:25432/one_door_shutdown
          CONTAINER_DATABASE_URL: postgresql://one_door:${{ env.LOCAL_DATABASE_PASSWORD }}@host.docker.internal:25432/one_door_shutdown

  infrastructure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd
        with:
          terraform_version: 1.16.1
          terraform_wrapper: false
      - run: terraform fmt -check -recursive infra
      - run: python3 -m unittest discover -s test/deployment -p 'test_*.py'
      - name: Validate Terraform and exercise deployment policies
        run: |
          set -euo pipefail
          for stack in bootstrap platform release install; do
            terraform -chdir=infra/$stack init -backend=false -input=false -lockfile=readonly
            terraform -chdir=infra/$stack validate
            terraform -chdir=infra/$stack test
          done
