<script>
(() => {
  const G = globalThis.relationshipGraph;
  const copy = globalThis.relationshipCopy;
  const SVG_NS = 'http://www.w3.org/2000/svg';
  const VIEWS = ['orbit', 'matrix'];
  const LAYER_CHOICES = ['all', ...G.layers];
  const BASES = ['recorded', 'interpretation', 'proposed'];

  // Every reader-facing string comes from copy.js. A missing key throws, so a
  // gap in the copy fails loudly instead of rendering a key or stand-in text.
  function t(path, vars = {}) {
    const value = path.split('.').reduce((node, key) => node?.[key], copy);
    if (typeof value !== 'string' || !value.trim()) throw new Error(`Missing copy: ${path}`);
    return value.replace(/\{(\w+)\}/g, (_, name) => {
      if (!(name in vars)) throw new Error(`Missing value {${name}} for ${path}`);
      return String(vars[name]);
    });
  }

  function build(el, props, children) {
    for (const [key, value] of Object.entries(props ?? {})) {
      if (value == null || value === false) continue;
      if (key === 'text') el.textContent = value;
      else if (key.startsWith('on')) el.addEventListener(key.slice(2), value);
      else el.setAttribute(key, value === true ? '' : String(value));
    }
    el.append(...children.flat(Infinity).filter((child) => child != null && child !== false && child !== 0));
    return el;
  }
  const h = (tag, props, ...children) => build(document.createElement(tag), props, children);
  const s = (tag, props, ...children) => build(document.createElementNS(SVG_NS, tag), props, children);

  const state = {
    view: 'orbit',
    role: 'agency',
    layer: 'all',
    selection: null,
    levels: 1,
    includeReconstructed: false,
  };

  const fullName = (id) => G.role(id).name;
  const shortName = (id) => t(`roleLabels.${id}`);
  const isProposedRole = (id) => G.role(id).arrangement === 'proposed';
  const partnerOf = (edge, id) => (edge.from === id ? edge.to : edge.from);
  const edgeLabel = (edge) => t(`edge.${edge.layer}`, { from: fullName(edge.from), to: fullName(edge.to) });
  // Qualifiers belong to cited source activities; a relationship only
  // reports that it includes qualified ones, and which.
  const includesText = (edge) => {
    const list = G.includedQualifiers(edge).map((q) => t(`qualifier.${q}`));
    return list.length ? t('qualifier.includes', { list: list.join(', ') }) : null;
  };
  const edgeName = (edge) => [edgeLabel(edge), t(`basis.${G.shownBasis(edge)}`), edge.signature && t('basis.signature'), includesText(edge)].filter(Boolean).join(', ');
  const qualifierTags = (edge) => includesText(edge) && tag('qualifier-includes', includesText(edge));
  const roleName = (id) => [fullName(id), isProposedRole(id) && t('basis.proposed')].filter(Boolean).join(', ');
  const markCount = (id) => G.blackHoleSteps(id).length;
  const roleNameWithMarks = (id) => (markCount(id) > 0 ? t('blackHole.count', { role: roleName(id), count: markCount(id) }) : roleName(id));
  const isSelected = (kind, id) => state.selection?.kind === kind && state.selection.id === id;
  const reducedMotion = () => matchMedia('(prefers-reduced-motion: reduce)').matches;

  // ---- location ----------------------------------------------------------

  function readHash() {
    const params = new URLSearchParams(location.hash.slice(1));
    if (VIEWS.includes(params.get('view'))) state.view = params.get('view');
    if (G.role(params.get('role'))) state.role = params.get('role');
    if (LAYER_CHOICES.includes(params.get('layer'))) state.layer = params.get('layer');
    state.includeReconstructed = params.get('reconstructed') === '1';
    const levels = Number(params.get('levels'));
    state.levels = Number.isInteger(levels) && levels > 1 ? levels : 1;
    const edge = G.edge(params.get('edge'));
    if (edge) state.selection = { kind: 'edge', id: edge.id };
    else if (G.role(params.get('role'))) state.selection = { kind: 'role', id: state.role };
  }

  function writeHash() {
    const params = new URLSearchParams({ view: state.view, layer: state.layer });
    if (state.selection) params.set('role', state.role);
    if (state.levels !== 1) params.set('levels', state.levels);
    if (state.includeReconstructed) params.set('reconstructed', '1');
    if (state.selection?.kind === 'edge') params.set('edge', state.selection.id);
    history.replaceState(null, '', `#${params}`);
  }

  // ---- shared pieces -----------------------------------------------------

  function shapePath(layer, cx, cy, r) {
    if (layer === 'decision') return s('rect', { x: cx - r * 0.88, y: cy - r * 0.88, width: r * 1.76, height: r * 1.76, rx: 1.5 });
    if (layer === 'information') return s('circle', { cx, cy, r });
    return s('path', { d: `M${cx} ${cy - r * 1.08}L${cx + r * 1.05} ${cy + r * 0.82}H${cx - r * 1.05}Z` });
  }

  // A small badge marks a relationship that cites at least one qualified source
  // activity; the qualifiers are in the name, tooltip and detail panel.
  const qualifiedBadge = (x, y) => s('circle', { class: 'qualified-badge', cx: x, cy: y, r: 3.2 });

  const shapeIcon = (layer, basis = 'recorded', qualified = false) =>
    s(
      'svg',
      { class: `shape shape--${basis}`, 'data-layer': layer, viewBox: '0 0 20 20', width: 20, height: 20, 'aria-hidden': 'true', focusable: 'false' },
      shapePath(layer, 10, 10, 6.5),
      qualified && qualifiedBadge(17, 3),
    );
  const isQualified = (edge) => G.includedQualifiers(edge).length > 0;

  const tag = (kind, text) => h('span', { class: `tag tag--${kind}`, text });
  // Tables show a dash with the phrase for assistive technology; roomier
  // places show the phrase itself.
  const absence = (key = 'absence.notRecorded', { visible = false } = {}) =>
    visible
      ? h('span', { class: 'absence', text: t(key) })
      : h('span', { class: 'absence' }, h('span', { 'aria-hidden': 'true', text: '–' }), h('span', { class: 'sr-only', text: t(key) }));

  function passage(id, { reconstructed = false, tags = G.passageQualifiers(id) } = {}) {
    const item = G.evidence(id);
    const notes = [t('citation.page', { document: G.documents[item.doc].name, page: item.page })];
    if (item.column) notes.push(t('citation.column', { column: item.column }));
    if (item.row) notes.push(t('citation.row', { row: item.row }));
    return h(
      'figure',
      { class: 'passage', 'data-evidence': id },
      reconstructed && tag('interpretation', t('basis.reconstructedPassage')),
      tags.map((q) => tag(`qualifier-${q}`, t(`qualifier.${q}`))),
      tags.map((q) => h('p', { class: 'passage__note', 'data-qualifier': q, text: t(`qualifierNote.${q}`) })),
      h('blockquote', {}, quotationWithMarkup(id, item.quotation)),
      h('figcaption', { text: notes.join(' · ') }),
    );
  }

  // Words the source strikes through render struck; the text itself is the
  // quotation exactly as extracted and checked.
  function quotationWithMarkup(id, quotation) {
    const struck = G.struckWords(id);
    if (!struck.length) return quotation;
    const pattern = new RegExp(`(${struck.map((w) => w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).join('|')})`);
    return quotation.split(pattern).map((part) => (struck.includes(part) ? h('del', { text: part }) : part));
  }

  const connector = (cards) =>
    h(
      'figure',
      { class: 'passage passage--connector', 'data-connector': cards.join(' | ') },
      tag('connector', t('evidence.connector')),
      h('blockquote', { text: cards.join(' → ') }),
      h('figcaption', { text: t('citation.page', { document: G.documents.usdr.name, page: 8 }) }),
    );

  const statement = (id) =>
    h(
      'figure',
      { class: 'passage passage--plan', 'data-statement': id },
      h('blockquote', { text: G.statements[id].text }),
      h('figcaption', { text: t('evidence.planOrigin') }),
    );

  function activateOnKey(event) {
    if (event.key !== 'Enter' && event.key !== ' ') return;
    event.preventDefault();
    event.currentTarget.dispatchEvent(new MouseEvent('click', { bubbles: true }));
  }

  function wrapWords(text, max) {
    const lines = [];
    for (const word of text.split(/\s+/)) {
      const last = lines.at(-1);
      if (last && `${last} ${word}`.length <= max) lines[lines.length - 1] = `${last} ${word}`;
      else lines.push(word);
    }
    return lines;
  }

  function svgLabel(text, x, y, anchor, { extra, max = 18 } = {}) {
    const lines = wrapWords(text, max);
    const lineHeight = 17;
    const all = extra ? [...lines, extra] : lines;
    return s(
      'text',
      { class: 'svg-label', x, y: y - ((all.length - 1) * lineHeight) / 2, 'text-anchor': anchor, 'dominant-baseline': 'middle' },
      all.map((line, i) =>
        s('tspan', { x, dy: i ? lineHeight : 0, class: extra && i === all.length - 1 ? 'svg-label__extra' : null, text: line }),
      ),
    );
  }

  const arrowDefs = () =>
    s(
      'defs',
      {},
      s(
        'marker',
        { id: 'arrow', viewBox: '0 0 10 10', refX: 8.5, refY: 5, markerWidth: 6, markerHeight: 6, orient: 'auto-start-reverse' },
        s('path', { class: 'arrowhead', d: 'M0 0L10 5L0 10Z' }),
      ),
    );

  function layerPicker() {
    return h(
      'fieldset',
      { class: 'segmented' },
      h('legend', { text: t('layers.pickerLabel') }),
      h(
        'div',
        { class: 'segmented__options' },
        LAYER_CHOICES.map((layer) =>
        h(
          'label',
          { class: 'segmented__option' },
          h('input', {
            type: 'radio',
            name: `layer-${state.view}`,
            value: layer,
            checked: state.layer === layer,
            'data-key': `layer:${layer}`,
            onchange: () => setLayer(layer),
          }),
          layer !== 'all' && shapeIcon(layer),
          h('span', { text: layer === 'all' ? t('layers.all') : t(`layers.${layer}`) }),
        ),
        ),
      ),
    );
  }

  // ---- role orbit --------------------------------------------------------

  // Level 1 is the baseline drawing: the centre role's own relationships, one
  // spoke and end per relationship. Each further level adds the roles one
  // connection further out, each hanging from one role of the level before by
  // one of their existing relationships; the other relationships between them
  // stay in the detail panel and the matrix. Levels show modeled distance, not
  // a procurement sequence.

  // Kept between renders so a re-centred orbit slides its ends from where
  // they were, and an unchanged orbit keeps its frame's scroll position.
  let lastOrbit = null;

  // Measured with the page's own font so placement matches the drawn text.
  let measurer;
  function textWidth(text, style) {
    measurer ??= document.createElement('canvas').getContext('2d');
    measurer.font = `${style} ${getComputedStyle(document.body).fontFamily}`;
    return measurer.measureText(text).width;
  }

  // An end's name: its lines as drawn, and the box they fill.
  function nameBox(id) {
    const lines = wrapWords(shortName(id), 20);
    const proposed = isProposedRole(id);
    const width = Math.max(...lines.map((line) => textWidth(line, '16px')), proposed ? textWidth(t('basis.proposed'), 'italic 14px') : 0);
    return { width, height: (lines.length + (proposed ? 1 : 0)) * 17 };
  }

  // Level 1 places relationships on two arcs around the focused role.
  // Position encodes only direction and relationship type.
  const WIDE = { width: 900, height: 620, cx: 450, cy: 310, radius: 215, core: 66, spread: 68 };
  // Each further level is a column on its side, beyond the names of the level before.
  const COLUMN = { first: 460, step: 232 };
  // The view shrinks to fit more levels, but never below this scale, which keeps names at 12px.
  const MIN_SCALE = 0.75;

  const layerGaps = (edges) => {
    let slot = 0;
    const slots = edges.map((edge, i) => {
      if (i && edge.layer !== edges[i - 1].layer) slot += 0.7;
      return slot++;
    });
    return { slots, total: slot };
  };

  function wideLayout(inbound, outbound) {
    const { width, height, cx, cy, radius, spread, core } = WIDE;
    const side = (edges, direction) => {
      const { slots, total } = layerGaps(edges);
      return {
        empty: edges.length ? null : { x: cx + direction * radius, y: cy, anchor: 'middle' },
        placed: edges.map((edge, i) => {
          const angle = ((-spread + (2 * spread * (slots[i] + 0.5)) / total) * Math.PI) / 180;
          const x = cx + direction * radius * Math.cos(angle);
          const y = cy + radius * Math.sin(angle);
          return { edge, x, y, labelX: x + direction * 26, anchor: direction > 0 ? 'start' : 'end', d: spoke({ cx, cy, r: core }, x, y, direction) };
        }),
      };
    };
    return {
      width,
      height,
      core: { cx, cy, r: core, max: 13 },
      halves: [side(inbound, -1), side(outbound, 1)],
      extras: [s('line', { class: 'orbit__divider', x1: cx, y1: 24, x2: cx, y2: height - 24 })],
    };
  }

  // A straight spoke between the core's rim and a satellite, pointing from
  // the relationship's source to its receiver.
  function spoke(core, x, y, direction) {
    const length = Math.hypot(x - core.cx, y - core.cy);
    const ux = (x - core.cx) / length;
    const uy = (y - core.cy) / length;
    const rim = [core.cx + ux * (core.r + 4), core.cy + uy * (core.r + 4)];
    const tip = [x - ux * 17, y - uy * 17];
    const [a, b] = direction > 0 ? [rim, tip] : [tip, rim];
    return `M${a[0]} ${a[1]}L${b[0]} ${b[1]}`;
  }

  // Which roles and relationships the orbit draws. Level 1 is the centre's
  // own relationships in the baseline halves. Each role first reached at a
  // further level hangs from the first connected role of the level before,
  // in drawing order, by their first relationship in the usual order. It
  // keeps its parent's side; a level-1 parent with ends on both sides sends
  // a child that points toward it to the left, as the halves do, and other
  // children to the right. Drawing order is the left side top to bottom,
  // then the right; a column stands in its parents' order on that side.
  function orbitTree(focus, layer, shown) {
    const own = G.edgesOf(focus, layer);
    const halves = [own.filter((e) => e.to === focus), own.filter((e) => e.from === focus)];
    // Each placed role's sides, with its place from the top on each.
    const sides = new Map();
    halves.forEach((edges, i) => {
      edges.forEach((edge, place) => {
        const partner = partnerOf(edge, focus);
        if (!sides.has(partner)) sides.set(partner, new Map());
        const side = i ? 'right' : 'left';
        if (!sides.get(partner).has(side)) sides.get(partner).set(side, place);
      });
    });
    let previous = [...sides.keys()];
    const levels = [];
    const reached = G.connectionLevels(focus, layer);
    for (let k = 2; k <= shown && k < reached.length; k += 1) {
      const branches = reached[k].map((id) => {
        const parent = previous.find((p) => G.edgesOf(p, layer).some((e) => partnerOf(e, p) === id));
        const edge = G.edgesOf(parent, layer).find((e) => partnerOf(e, parent) === id);
        const parentSides = sides.get(parent);
        const side = parentSides.size === 1 ? [...parentSides.keys()][0] : edge.to === parent ? 'left' : 'right';
        return { id, parent, edge, side, level: k };
      });
      const column = (side) => {
        const placed = branches.filter((b) => b.side === side).sort((a, b) => sides.get(a.parent).get(side) - sides.get(b.parent).get(side));
        placed.forEach((b, place) => sides.set(b.id, new Map([[side, place]])));
        return placed;
      };
      const ordered = [...column('left'), ...column('right')];
      levels.push(ordered);
      previous = ordered.map((b) => b.id);
    }
    return { halves, levels, drawn: new Set([...own, ...levels.flat().map((b) => b.edge)].map((e) => e.id)) };
  }

  const levelCount = (id = state.role) => G.connectionLevels(id, state.layer).length - 1;
  const orbitDraws = (edgeId) => orbitTree(state.role, state.layer, state.levels).drawn.has(edgeId);

  // Places each further level's column. A child starts level with its parent;
  // children then spread just enough that names never touch, and the column
  // keeps its parents' average height.
  function branchLayout(tree, layout) {
    const { cx } = layout.core;
    const anchors = new Map();
    const ends = layout.halves.flatMap((half) => half.placed);
    for (const spot of ends) {
      const partner = partnerOf(spot.edge, state.role);
      const side = spot.x < cx ? 'left' : 'right';
      if (!anchors.has(`${partner}:${side}`)) anchors.set(`${partner}:${side}`, spot);
    }
    const reach = (spot, partner) => {
      const direction = spot.x < cx ? -1 : 1;
      return { x: spot.labelX + direction * (nameBox(partner).width + 6), y: spot.y };
    };
    return tree.levels.map((level, i) =>
      ['left', 'right'].flatMap((side) => {
        const direction = side === 'left' ? -1 : 1;
        const x = cx + direction * (COLUMN.first + i * COLUMN.step);
        const column = level.filter((b) => b.side === side).map((b) => {
          const parentSpot = anchors.get(`${b.parent}:${side}`);
          return { ...b, from: reach(parentSpot, b.parent), box: nameBox(b.id) };
        });
        // Lines from one parent leave its name a few pixels apart, so their arrowheads never stack.
        for (const b of column) {
          const siblings = column.filter((other) => other.parent === b.parent);
          b.start = { x: b.from.x, y: b.from.y + (siblings.indexOf(b) - (siblings.length - 1) / 2) * 6 };
        }
        let y = -Infinity;
        for (const b of column) {
          const previous = column[column.indexOf(b) - 1];
          const gap = previous ? Math.max(44, (previous.box.height + b.box.height) / 2 + 12) : 0;
          y = Math.max(b.from.y, y + gap);
          b.y = y;
        }
        const shift = column.reduce((sum, b) => sum + b.from.y - b.y, 0) / (column.length || 1);
        return column.map((b) => {
          const spot = { edge: b.edge, partner: b.id, level: b.level, x, y: b.y + shift, labelX: x + direction * 26, anchor: direction > 0 ? 'start' : 'end' };
          anchors.set(`${b.id}:${side}`, spot);
          // A gentle curve from the parent's name to the child's mark, drawn
          // from the relationship's source to its receiver.
          const near = { x: x - direction * 17, y: spot.y };
          const [a, z] = b.edge.from === b.parent ? [b.start, near] : [near, b.start];
          const mid = (a.x + z.x) / 2;
          return { ...spot, d: `M${a.x} ${a.y}C${mid} ${a.y} ${mid} ${z.y} ${z.x} ${z.y}` };
        });
      }),
    );
  }

  // Agency contact routes always run from a role to the agency, so with only
  // that type shown, a role's inbound half and the agency's outbound half
  // cannot hold one.
  const impossible = (id, direction) =>
    state.layer === 'communication' && (direction === 'In' ? id !== 'agency' : id === 'agency');

  function orbitHalf({ empty, placed }, name, absenceKey, core) {
    return s(
      'g',
      { role: 'group', 'aria-label': name },
      empty && s('text', { class: 'orbit__empty', x: empty.x, y: empty.y, 'text-anchor': empty.anchor, 'dominant-baseline': 'middle', text: t(absenceKey) }),
      placed.map((spot) => satellite({ ...spot, partner: partnerOf(spot.edge, state.role), level: 1 }, core)),
    );
  }

  // One relationship as in the baseline: a line and an end mark with the
  // partner's name. The line opens the relationship's evidence; the end mark
  // and name re-centre the orbit on the partner, who repeats once per
  // level-1 relationship. Conditions and provenance stay in names and the detail panel.
  function satellite({ edge, partner, level, x, y, labelX, anchor, d }, core) {
    const basis = G.shownBasis(edge);
    const { width, height } = nameBox(partner);
    const left = anchor === 'end' ? labelX - width : labelX;
    const selected = isSelected('edge', edge.id);
    // A target midway along the line gives the thin line a comfortable size.
    const n = d.match(/-?[\d.]+(?:e-?\d+)?/g).map(Number);
    const mid = n.length === 4 ? { x: (n[0] + n[2]) / 2, y: (n[1] + n[3]) / 2 } : { x: (n[0] + 3 * n[2] + 3 * n[4] + n[6]) / 8, y: (n[1] + 3 * n[3] + 3 * n[5] + n[7]) / 8 };
    return s(
      'g',
      { class: selected ? 'sat is-selected' : 'sat', 'data-edge': edge.id, 'data-layer': edge.layer, 'data-level': level },
      s(
        'g',
        {
          class: 'rel rel--spoke',
          role: 'button',
          tabindex: '0',
          'aria-current': selected ? 'true' : null,
          'data-key': `edge:${edge.id}`,
          'data-edge': edge.id,
          'data-basis': basis,
          onclick: (event) => select({ kind: 'edge', id: edge.id }, event),
          onkeydown: activateOnKey,
        },
        // The title is both the accessible name and the hover tooltip.
        s('title', { text: edgeName(edge) }),
        s('path', { class: 'line__hit', d }),
        s('circle', { class: 'rel__hit', cx: mid.x, cy: mid.y, r: 10 }),
        s('path', { class: 'rel__focus', d }),
        s('path', { class: `link link--${basis}`, d, 'marker-end': 'url(#arrow)' }),
      ),
      s(
        'g',
        {
          class: 'node node--end',
          role: 'button',
          tabindex: '0',
          'data-key': `end:${edge.id}`,
          'data-node': partner,
          'data-x': (x - core.cx).toFixed(1),
          'data-y': (y - core.cy).toFixed(1),
          'data-proposed': isProposedRole(partner) ? 'true' : null,
          onclick: () => centreOrbit(partner),
          onkeydown: activateOnKey,
        },
        s('title', { text: t('orbit.centerOn', { role: roleName(partner) }) }),
        s('circle', { class: 'node__hit', cx: x, cy: y, r: 22 }),
        // Label text ignores the pointer; this box makes the whole name part of the end.
        s('rect', { class: 'node__hit', x: left - 2, y: y - height / 2 - 2, width: width + 4, height: height + 4 }),
        s('circle', { class: 'sat__ring', cx: x, cy: y, r: 16 }),
        s('circle', { class: 'node__focus', cx: x, cy: y, r: 21 }),
        s('g', { class: `shape shape--${basis}` }, shapePath(edge.layer, x, y, 9)),
        svgLabel(shortName(partner), labelX, y, anchor, { extra: isProposedRole(partner) && t('basis.proposed'), max: 20 }),
      ),
    );
  }

  function orbitView() {
    const focus = state.role;
    const tree = orbitTree(focus, state.layer, state.levels);
    const layout = wideLayout(...tree.halves);
    const branches = branchLayout(tree, layout);
    const names = [t('orbit.inbound'), t('orbit.outbound')];
    const previous = lastOrbit;
    const key = `${focus}|${state.levels}|${state.layer}`;
    const frameBefore = document.querySelector('.orbit__frame');
    const scrollBefore = frameBefore && [frameBefore.scrollLeft, frameBefore.scrollTop];
    const placedBefore = new Map([...document.querySelectorAll('svg.orbit .node[data-node]')].map((el) => [el.dataset.node, { x: Number(el.dataset.x), y: Number(el.dataset.y) }]));
    lastOrbit = { focus, key };
    afterRender.push(() => {
      anchorOrbit(previous?.key === key ? scrollBefore : null);
      if (previous && previous.focus !== focus && !reducedMotion()) slideNodes(placedBefore);
    });
    const ownCount = tree.halves.flat().length;
    return [
      layerPicker(),
      levelControl(),
      h('p', { class: 'note', text: t('orbit.levelsNote') }),
      // As in the baseline, the two halves are named above the drawing while
      // only the centre's own relationships show; the row keeps its height
      // when hidden so the frame never moves.
      h(
        'div',
        { class: ownCount && state.levels === 1 ? 'orbit__halves' : 'orbit__halves is-hidden', 'aria-hidden': 'true' },
        h('p', { text: names[0] }),
        h('p', { text: names[1] }),
      ),
      h(
        'div',
        { class: 'orbit__frame' },
        s(
          'svg',
          { class: 'orbit', role: 'group', 'aria-label': t('orbit.chart', { role: fullName(focus) }) },
          arrowDefs(),
          // The drawing, moved so the centre role sits at (0, 0).
          s(
            'g',
            { transform: `translate(${-layout.core.cx} ${-layout.core.cy})` },
            layout.extras,
            orbitHalf(layout.halves[0], names[0], impossible(focus, 'In') ? 'absence.notApplicable' : 'absence.notRecorded', layout.core),
            orbitCore(focus, layout.core),
            orbitHalf(layout.halves[1], names[1], impossible(focus, 'Out') ? 'absence.notApplicable' : 'absence.notRecorded', layout.core),
            branches.map((level, i) =>
              s('g', { role: 'group', 'aria-label': t('orbit.levelGroup', { n: i + 2 }) }, level.map((spot) => satellite(spot, layout.core))),
            ),
          ),
        ),
      ),
    ];
  }

  // Zooming out shows one more connection level, zooming in one fewer.
  function levelControl() {
    const total = levelCount();
    const shown = Math.min(state.levels, total);
    // aria-disabled keeps a limit button focusable, so focus stays put at the limit.
    const step = (n) => () => {
      if (n < 1 || n > total) return;
      state.levels = n;
      // Fewer levels can hide the chosen relationship; the choice returns to the centre.
      if (state.selection?.kind === 'edge' && !orbitDraws(state.selection.id)) state.selection = { kind: 'role', id: state.role };
      render();
      say(t('orbit.levelsShown', { shown: n, total }));
    };
    return h(
      'div',
      { class: 'zoom', role: 'group', 'aria-labelledby': 'zoom-label' },
      h('span', { id: 'zoom-label', class: 'zoom__label', text: t('orbit.zoomLabel') }),
      h('button', { class: 'zoom__button', 'data-key': 'zoom:in', 'aria-disabled': shown <= 1 ? 'true' : null, onclick: step(shown - 1), text: t('orbit.zoomIn') }),
      h('button', { class: 'zoom__button', 'data-key': 'zoom:out', 'aria-disabled': shown >= total ? 'true' : null, onclick: step(shown + 1), text: t('orbit.zoomOut') }),
      h('span', { class: 'zoom__count', text: t('orbit.levelsShown', { shown, total }) }),
    );
  }

  // The centre role keeps one place in the frame at every role, type and
  // level: the middle of the frame, whose size never depends on the drawing.
  // The view shrinks, never below MIN_SCALE, to fit the drawing's farthest
  // reach from the centre on either side, so a lopsided drawing never moves
  // the centre. The drawing's bounds are the browser's own box around
  // everything drawn, widened so the centre sits at that place; what does not
  // fit scrolls inside the frame. `keep` restores a reader's own scroll.
  function anchorOrbit(keep) {
    const svg = document.querySelector('svg.orbit');
    if (!svg) return;
    const frame = svg.parentElement;
    const { clientWidth: fw, clientHeight: fh } = frame;
    const box = svg.getBBox();
    const pad = 12;
    const reachX = Math.max(-box.x, box.x + box.width) + pad;
    const reachY = Math.max(-box.y, box.y + box.height) + pad;
    const scale = Math.min(1, Math.max(MIN_SCALE, Math.min(fw / 2 / reachX, fh / 2 / reachY)));
    const anchorX = fw / 2;
    const anchorY = fh / 2;
    const left = Math.min(box.x - pad, -anchorX / scale);
    const top = Math.min(box.y - pad, -anchorY / scale);
    const right = Math.max(box.x + box.width + pad, (fw - anchorX) / scale);
    const bottom = Math.max(box.y + box.height + pad, (fh - anchorY) / scale);
    svg.setAttribute('viewBox', `${left.toFixed(1)} ${top.toFixed(1)} ${(right - left).toFixed(1)} ${(bottom - top).toFixed(1)}`);
    svg.setAttribute('width', ((right - left) * scale).toFixed(1));
    svg.setAttribute('height', ((bottom - top) * scale).toFixed(1));
    [frame.scrollLeft, frame.scrollTop] = keep ?? [-left * scale - anchorX, -top * scale - anchorY];
  }

  // Nodes slide from their old places to their new ones and new lines fade
  // in; a node not shown before fades in where it lands. The centre stays put.
  function slideNodes(before) {
    const svg = document.querySelector('svg.orbit');
    const nodes = [...svg.querySelectorAll('.node[data-node]')];
    for (const el of nodes) {
      const from = before.get(el.dataset.node);
      if (from) el.style.transform = `translate(${from.x - Number(el.dataset.x)}px, ${from.y - Number(el.dataset.y)}px)`;
      else el.classList.add('is-new');
    }
    svg.getBoundingClientRect();
    svg.classList.add('is-recentring');
    for (const el of nodes) el.style.transform = '';
  }

  // The centre shows only its name; its research-marker count stays in its
  // accessible name and the detail panel.
  function orbitCore(id, { cx, cy, r, max }) {
    return s(
      'g',
      {
        class: 'core',
        role: 'button',
        tabindex: '0',
        'aria-label': roleNameWithMarks(id),
        'aria-current': isSelected('role', id) ? 'true' : null,
        'data-key': `role:${id}`,
        'data-proposed': isProposedRole(id) ? 'true' : null,
        onclick: (event) => select({ kind: 'role', id }, event),
        onkeydown: activateOnKey,
      },
      s('circle', { class: 'core__disc', cx, cy, r }),
      svgLabel(shortName(id), cx, cy, 'middle', { extra: isProposedRole(id) && t('basis.proposed'), max }),
    );
  }

  // ---- who-to-whom matrix ------------------------------------------------

  function matrixView() {
    const ids = G.roles.map((r) => r.id);
    const header = (id, axis) =>
      h(
        'button',
        {
          class: 'role-button matrix__role',
          'data-key': `role:${id}:${axis}`,
          'aria-current': isSelected('role', id) ? 'true' : null,
          onclick: (event) => select({ kind: 'role', id }, event),
        },
        h('span', { class: 'matrix__label', 'aria-hidden': 'true', text: shortName(id) }),
        h('span', { class: 'sr-only', text: fullName(id) }),
        isProposedRole(id) && tag('proposed', t('basis.proposed')),
      );
    return [
      layerPicker(),
      h('p', { class: 'note', text: t('matrix.directionNote') }),
      h(
        'div',
        { class: 'scroller scroller--matrix' },
        h(
          'table',
          { class: 'matrix' },
          h('caption', { text: t('matrix.caption') }),
          h(
            'thead',
            {},
            h(
              'tr',
              {},
              h('th', { scope: 'col', class: 'matrix__corner', text: t('matrix.corner') }),
              ids.map((id) => h('th', { scope: 'col', 'data-col': id, class: state.role === id ? 'is-current' : null }, header(id, 'column'))),
            ),
          ),
          h(
            'tbody',
            {},
            ids.map((from) =>
              h(
                'tr',
                { 'data-row': from, class: [from === 'agency' && 'matrix__agency', state.role === from && 'is-current'].filter(Boolean).join(' ') || null },
                h('th', { scope: 'row' }, header(from, 'row')),
                ids.map((to) => matrixCell(from, to)),
              ),
            ),
          ),
        ),
      ),
    ];
  }

  function matrixCell(from, to) {
    const current = state.role === from || state.role === to ? 'is-current' : null;
    if (from === to) return h('td', { class: 'matrix__self' }, h('span', { class: 'sr-only', text: t('absence.notApplicable') }));
    const edges = G.edges
      .filter((e) => e.from === from && e.to === to && (state.layer === 'all' || e.layer === state.layer))
      .sort((a, b) => G.layers.indexOf(a.layer) - G.layers.indexOf(b.layer));
    if (!edges.length) return h('td', { class: current }, h('span', { class: 'sr-only', text: t('absence.notRecorded') }));
    return h(
      'td',
      { class: current },
      edges.map((edge) => {
        const basis = G.shownBasis(edge);
        return h(
          'button',
          {
            class: 'mark',
            'data-key': `edge:${edge.id}`,
            'data-edge': edge.id,
            'data-layer': edge.layer,
            'data-basis': basis,
            title: edgeName(edge),
            'aria-current': isSelected('edge', edge.id) ? 'true' : null,
            onclick: (event) => select({ kind: 'edge', id: edge.id }, event),
          },
          shapeIcon(edge.layer, basis, isQualified(edge)),
        );
      }),
    );
  }

  // ---- detail panel ------------------------------------------------------

  const heading = (text) => h('h2', { id: 'detail-heading', class: 'detail__heading', tabindex: '-1', text });
  const section = (title, ...content) => h('section', { class: 'detail__section' }, h('h3', { text: title }), content);

  function relationItem(edge, id) {
    const basis = G.shownBasis(edge);
    return h(
      'li',
      {},
      h(
        'button',
        {
          class: 'relation',
          'data-key': `detail-edge:${edge.id}`,
          'data-edge': edge.id,
          'aria-current': isSelected('edge', edge.id) ? 'true' : null,
          'aria-label': edgeName(edge),
          onclick: (event) => select({ kind: 'edge', id: edge.id }, event),
        },
        shapeIcon(edge.layer, basis),
        h('span', { class: 'relation__name', text: fullName(partnerOf(edge, id)) }),
        tag(basis, t(`basis.${basis}`)),
        edge.signature && tag('signature', t('basis.signature')),
        qualifierTags(edge),
      ),
    );
  }

  function blackHoleSection(id) {
    const marked = G.blackHoleSteps(id);
    if (!marked.length) return null;
    return section(
      t('blackHole.heading'),
      marked.map((step, i) =>
        h('div', { class: 'step' }, h('p', { class: 'step__label', text: t('blackHole.mark', { role: fullName(id), n: i + 1, count: marked.length }) }), passage(step.evidence)),
      ),
      h('p', { class: 'note', text: t('blackHole.placement') }),
      h('h4', { text: t('blackHole.legendHeading') }),
      passage(G.blackHoles.legend),
    );
  }

  function gapSection(id) {
    const gap = G.gapOf(id);
    if (!gap) return null;
    return section(
      t('gap.heading'),
      h('p', {}, tag(`gap-${gap.kind}`, t(`gap.${gap.kind}`))),
      h('p', { text: t(`gap.${gap.kind}Basis`) }),
      gap.evidence.map((ev) => passage(ev)),
    );
  }

  function roleDetail(id) {
    const role = G.role(id);
    const layer = state.layer;
    return [
      heading(role.name),
      isProposedRole(id) && [h('p', {}, tag('proposed', t('basis.proposed'))), h('p', { text: t('basisNote.proposed') })],
      role.roles &&
        section(
          t('detail.roleTitles'),
          h(
            'ul',
            { class: 'titles' },
            role.roles.map((title) =>
              h('li', {}, h('span', { text: title }), G.titleIsMapped(id, title) && [' ', tag('qualifier-roleMapping', t('qualifier.roleMapping'))]),
            ),
          ),
        ),
      section(
        t('detail.relationships'),
        G.relationsFor(id, layer).map((relation) => {
          const edges = G.edgesIn(id, relation);
          return h(
            'div',
            { class: 'relation-group', 'data-relation': relation },
            h('h4', { text: t(`relations.${relation}`) }),
            edges.length ? h('ul', { class: 'relation-list' }, edges.map((edge) => relationItem(edge, id))) : h('p', {}, absence(undefined, { visible: true })),
          );
        }),
      ),
      blackHoleSection(id),
      gapSection(id),
    ];
  }

  function edgeDetail(id) {
    const edge = G.edge(id);
    const basis = G.shownBasis(edge);
    const centreOn = state.view === 'orbit' ? [edge.from, edge.to].filter((end) => end !== state.role) : [];
    return [
      heading(edgeLabel(edge)),
      h(
        'p',
        { class: 'tags' },
        shapeIcon(edge.layer, basis),
        tag(basis, t(`basis.${basis}`)),
        edge.signature && tag('signature', t('basis.signature')),
        qualifierTags(edge),
        edge.origin && tag(`origin-${edge.origin}`, t(`origin.${edge.origin}`)),
      ),
      h('p', { text: t(`basisNote.${G.basisOf(edge)}`) }),
      edge.origin && h('p', { class: 'qualifier-note', 'data-origin': edge.origin, text: t(`originNote.${edge.origin}`) }),
      centreOn.map((end) =>
        h('p', {}, h('button', { class: 'text-button', 'data-key': `centre:${end}`, onclick: () => centreOrbit(end), text: t('orbit.centerOn', { role: fullName(end) }) })),
      ),
      section(
        t('evidence.heading'),
        edge.evidence.map((ev) => passage(ev, { reconstructed: edge.inferred?.includes(ev), tags: G.passageTags(edge, ev) })),
        G.connectorsOf(edge).map(connector),
      ),
      edge.caveats && section(t('evidence.caveatsHeading'), edge.caveats.map((ev) => passage(ev, { tags: G.passageTags(edge, ev) }))),
      edge.statements && section(t('evidence.statementsHeading'), edge.statements.map(statement)),
    ];
  }

  function renderDetail() {
    const selection = state.selection;
    if (!selection) return h('p', { id: 'detail-heading', class: 'empty', text: t('detail.empty') });
    if (selection.kind === 'role') return roleDetail(selection.id);
    return edgeDetail(selection.id);
  }

  const selectionName = (selection) => (selection.kind === 'role' ? roleName(selection.id) : edgeName(G.edge(selection.id)));

  // ---- state changes -----------------------------------------------------

  function say(text) {
    dom.status.textContent = '';
    setTimeout(() => {
      dom.status.textContent = text;
    }, 30);
  }

  function select(selection, event) {
    const origin = event?.currentTarget;
    const fromChart = origin instanceof Element && dom.panels[state.view].el.contains(origin);
    const originKey = origin?.dataset?.key;
    state.selection = selection;
    if (selection.kind === 'role') state.role = selection.id;
    render();
    say(t('status.selected', { item: selectionName(selection) }));
    if (fromChart) revealDetail(originKey, event.detail === 0);
  }

  // When a choice in a chart updates a panel that is out of view, bring the
  // panel into view with a button back to the chosen mark. Keyboard users
  // move to the panel's heading; pointer users keep their focus.
  function revealDetail(originKey, byKeyboard) {
    const heading = dom.detail.querySelector('#detail-heading');
    const top = heading.getBoundingClientRect().top;
    if (top >= 0 && top < innerHeight - 48) return;
    const back = h('button', {
      class: 'text-button detail__return',
      'data-key': 'detail-return',
      onclick: () => {
        const mark = document.querySelector(`[data-key="${CSS.escape(originKey)}"]`);
        mark?.scrollIntoView({ block: 'center', behavior: reducedMotion() ? 'auto' : 'smooth' });
        mark?.focus({ preventScroll: true });
        back.remove();
      },
      text: t('detail.return'),
    });
    dom.detail.prepend(back);
    dom.detail.scrollIntoView({ block: 'start', behavior: reducedMotion() ? 'auto' : 'smooth' });
    if (byKeyboard) heading.focus({ preventScroll: true });
  }

  // Focusing the orbit on a partner selects that role and moves keyboard
  // focus to the orbit's centre, which also brings it into view on narrow screens.
  function centreOrbit(id) {
    state.selection = { kind: 'role', id };
    state.role = id;
    render();
    say(t('status.selected', { item: roleName(id) }));
    document.querySelector('.core')?.focus();
  }

  function setLayer(layer) {
    state.layer = layer;
    // A further level's relationship can leave the drawing under another type; the choice returns to the centre.
    const edge = state.selection?.kind === 'edge' && G.edge(state.selection.id);
    if (edge && ![edge.from, edge.to].includes(state.role) && !orbitTree(state.role, layer, Math.min(state.levels, Math.max(1, levelCount()))).drawn.has(edge.id)) {
      state.selection = { kind: 'role', id: state.role };
    }
    render();
  }

  function setView(view) {
    state.view = view;
    render();
  }

  function onTabKey(event) {
    const i = VIEWS.indexOf(state.view);
    const next = { ArrowRight: i + 1, ArrowLeft: i - 1, Home: 0, End: VIEWS.length - 1 }[event.key];
    if (next === undefined) return;
    event.preventDefault();
    setView(VIEWS[(next + VIEWS.length) % VIEWS.length]);
    dom.tabs[state.view].focus();
  }

  // ---- page --------------------------------------------------------------

  const afterRender = [];
  const RENDERERS = { orbit: orbitView, matrix: matrixView };

  function lineSample(basis) {
    return s(
      'svg',
      { class: 'line-sample', 'data-layer': 'neutral', viewBox: '0 0 44 20', width: 44, height: 20, 'aria-hidden': 'true', focusable: 'false' },
      s('line', { class: `link link--${basis}`, x1: 2, y1: 10, x2: 26, y2: 10 }),
      s('g', { class: `shape shape--${basis}` }, shapePath('information', 35, 10, 6)),
    );
  }

  // Types and sources stay in view; the fuller definitions stay one click away.
  function legend() {
    return h(
      'section',
      { class: 'legend', 'aria-labelledby': 'legend-heading' },
      h('h2', { id: 'legend-heading', text: t('legend.heading') }),
      h(
        'ul',
        { class: 'legend__items' },
        G.layers.map((layer) => h('li', { 'data-legend': layer }, shapeIcon(layer), h('span', { text: t(`layers.${layer}`) }))),
        BASES.map((basis) => h('li', { 'data-legend': basis }, lineSample(basis), h('span', { text: t(`basis.${basis}`) }))),
      ),
      h(
        'details',
        { class: 'legend__more' },
        h('summary', { text: t('legend.more') }),
        h(
          'ul',
          { class: 'legend__items' },
          h(
            'li',
            { 'data-legend': 'qualified' },
            s(
              'svg',
              { class: 'shape shape--recorded', 'data-layer': 'neutral', viewBox: '0 0 20 20', width: 20, height: 20, 'aria-hidden': 'true', focusable: 'false' },
              shapePath('information', 10, 10, 6.5),
              qualifiedBadge(17, 3),
            ),
            h('span', { text: t('legend.qualified') }),
          ),
        ),
        h('p', { text: t('legend.absence') }),
        h('p', { text: t('legend.order') }),
        h('p', { text: t('legend.records') }),
        h('p', { text: t('blackHole.placement') }),
        h('p', { text: t('legend.origin') }),
      ),
    );
  }

  function renderShell() {
    document.title = t('page.title');
    const tabs = {};
    const panels = {};
    for (const view of VIEWS) {
      tabs[view] = h(
        'button',
        { role: 'tab', id: `tab-${view}`, class: 'tab', 'aria-controls': `panel-${view}`, onclick: () => setView(view), onkeydown: onTabKey },
        t(`views.${view}.name`),
      );
      const title = h('h2', { class: 'panel__heading', tabindex: '-1', text: t(`views.${view}.name`) });
      const body = h('div', { class: 'panel__body' });
      panels[view] = {
        title,
        body,
        el: h(
          'section',
          { role: 'tabpanel', id: `panel-${view}`, class: 'panel', 'aria-labelledby': `tab-${view}`, hidden: true },
          title,
          h('p', { class: 'purpose', text: t(`views.${view}.purpose`) }),
          body,
        ),
      };
    }
    const picker = h(
      'select',
      { id: 'role-picker', onchange: (event) => select({ kind: 'role', id: event.target.value }) },
      G.roles.map((role) => h('option', { value: role.id, text: roleName(role.id) })),
    );
    const detail = h('aside', { class: 'detail', 'aria-labelledby': 'detail-heading' });
    const status = h('p', { class: 'sr-only', role: 'status', 'aria-live': 'polite' });
    document.getElementById('app').replaceChildren(
      h(
        'header',
        { class: 'masthead' },
        // The two prototype pages as equal tabs; navigation.css styles them.
        h(
          'nav',
          { class: 'workspace-nav', 'aria-label': t('page.navLabel') },
          h('a', { href: 'index.html', 'aria-current': 'page', text: t('page.exploreLink') }),
          h('a', { href: 'email/notification-mockup.html', text: t('page.emailLink') }),
        ),
        h('h1', { text: t('page.heading') }),
        h('p', { class: 'lede', text: t('page.instructions') }),
      ),
      h(
        'main',
        { class: 'layout' },
        h('div', { class: 'controls' }, h('label', { for: 'role-picker', text: t('roles.pickerLabel') }), picker),
        h('div', { role: 'tablist', class: 'tabs', 'aria-label': t('views.label') }, Object.values(tabs)),
        h('div', { class: 'workspace', 'data-view': state.view }, h('div', { class: 'workspace__main' }, Object.values(panels).map((p) => p.el), legend()), detail),
      ),
      status,
    );
    return { tabs, panels, picker, detail, status };
  }

  // The level count never exceeds what the centre has under the type shown.
  // A chosen relationship stays where the orbit draws it: an end of it becomes
  // the centre unless the shown levels already draw it. A type filter that
  // does not draw the relationship returns the selection to the role.
  function normalizeSelection() {
    const clampLevels = () => (state.levels = Math.max(1, Math.min(state.levels, levelCount())));
    clampLevels();
    const edge = state.selection?.kind === 'edge' && G.edge(state.selection.id);
    if (!edge) return;
    if (state.layer !== 'all' && edge.layer !== state.layer) {
      state.selection = { kind: 'role', id: state.role };
      return;
    }
    if (![edge.from, edge.to].includes(state.role) && !orbitDraws(edge.id)) {
      state.role = edge.from;
      clampLevels();
    }
  }

  // Narrow tables scroll inside a frame, so their sticky header row sticks to
  // the frame's top; styles.css moves it down by this distance once the page
  // scrolls past that top, keeping it inside the frame.
  function pinTableHeaders() {
    for (const scroller of document.querySelectorAll('.scroller:has(thead)')) {
      const past = -(scroller.getBoundingClientRect().top + scroller.clientTop);
      const room = scroller.clientHeight - scroller.querySelector('thead').offsetHeight;
      scroller.style.setProperty('--past-frame-top', `${Math.max(0, Math.min(past, room))}px`);
    }
  }

  // The detail panel never scrolls on its own: ordinary page scrolling reveals
  // every passage. It stays beside the chart only while it fits the window.
  function fitDetail() {
    dom.detail.classList.toggle('is-sticky', dom.detail.offsetHeight <= innerHeight - 32);
  }

  function render() {
    normalizeSelection();
    const active = document.activeElement;
    const focusKey = active?.closest?.('[data-key]')?.dataset.key;
    const focusWasInPanel = dom.panels[state.view].el.contains(active);
    dom.picker.value = state.role;
    dom.detail.parentElement.dataset.view = state.view;
    for (const view of VIEWS) {
      const current = view === state.view;
      dom.tabs[view].setAttribute('aria-selected', String(current));
      dom.tabs[view].tabIndex = current ? 0 : -1;
      dom.panels[view].el.hidden = !current;
      dom.panels[view].body.replaceChildren(...(current ? [RENDERERS[view]()].flat(Infinity).filter(Boolean) : []));
    }
    dom.detail.replaceChildren(...[renderDetail()].flat(Infinity).filter(Boolean));
    for (const task of afterRender.splice(0)) task();
    fitDetail();
    pinTableHeaders();
    writeHash();
    if (active && !active.isConnected) {
      const replacement = focusKey && document.querySelector(`[data-key="${CSS.escape(focusKey)}"]`);
      if (replacement) replacement.focus({ preventScroll: true });
      else if (focusWasInPanel) dom.panels[state.view].title.focus({ preventScroll: true });
      else dom.detail.querySelector('#detail-heading')?.focus({ preventScroll: true });
    }
  }

  readHash();
  const dom = renderShell();
  render();
  window.addEventListener('resize', () => {
    fitDetail();
    pinTableHeaders();
    anchorOrbit();
  });
  window.addEventListener('scroll', pinTableHeaders, { passive: true });
  // Tables keep their header row and role column pinned; move focused body
  // content clear of both, scrolling the page for what the frame cannot. Role
  // names are the pinned column, so only cells need the sideways move.
  function clearOfPinned(target) {
    const cell = target.closest('.scroller tbody :is(td, th)');
    if (!cell || document.activeElement !== target) return;
    const scroller = cell.closest('.scroller');
    // Scroll events arrive a frame late; measure against the current page position.
    pinTableHeaders();
    const header = scroller.querySelector('thead th').getBoundingClientRect().bottom;
    const item = target.getBoundingClientRect();
    if (cell.tagName === 'TD') {
      const pinned = cell.parentElement.querySelector('th').getBoundingClientRect().right;
      const box = scroller.getBoundingClientRect();
      if (item.left < pinned) scroller.scrollLeft -= pinned - item.left + 8;
      else if (item.right > box.right) scroller.scrollLeft += item.right - box.right + 8;
    }
    if (item.top < header) {
      const needed = header - item.top + 8;
      const before = scroller.scrollTop;
      scroller.scrollTop -= needed;
      window.scrollBy(0, before - scroller.scrollTop - needed);
      pinTableHeaders();
    }
  }
  // The browser scrolls a newly focused element into view after focus events
  // run, which can undo a correction; so correct again after that scroll.
  document.addEventListener('focusin', (event) => {
    clearOfPinned(event.target);
    requestAnimationFrame(() => clearOfPinned(event.target));
  });
  window.addEventListener('hashchange', () => {
    readHash();
    render();
  });
})();

</script>
<script>
prototypePages.start();
</script>
  </body>
</html>
