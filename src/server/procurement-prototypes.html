<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title></title>
<style>
:root {
  color-scheme: light dark;
  --bg: light-dark(#ffffff, #0c1a33);
  --surface: light-dark(#f5f7fa, #11223f);
  --raised: light-dark(#ffffff, #152a4b);
  --text: light-dark(#0f2140, #e6ebf3);
  --muted: light-dark(#4b5b75, #a8b5c9);
  --border: light-dark(#d5dce6, #2b3d5c);
  --strong-border: light-dark(#7a879c, #7088ad);
  --accent: light-dark(#1d5bb8, #8db6ff);
  --accent-soft: light-dark(#e6effb, #1c355e);
  --decision: light-dark(#6b3fa0, #c9adf5);
  --information: light-dark(#0b6e75, #6fd6dc);
  --communication: light-dark(#a14d00, #ffb36b);
  font: 400 16px/1.5 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
}

[hidden] {
  display: none !important;
}

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  overflow: hidden;
  clip: rect(0 0 0 0);
  clip-path: inset(50%);
  white-space: nowrap;
}

:focus-visible {
  outline: 3px solid var(--accent);
  outline-offset: 2px;
}

button {
  font: inherit;
  color: inherit;
}

a {
  color: var(--accent);
}

/* ---- page ---- */

.masthead,
.layout {
  max-width: 1440px;
  margin: 0 auto;
  padding-inline: 24px;
}

.masthead {
  padding-block: 28px 4px;
}

.masthead h1 {
  margin: 0 0 8px;
  font-size: 1.75rem;
  line-height: 1.25;
}

.lede {
  max-width: 72ch;
  margin: 0 0 8px;
}

.text-button {
  padding: 0;
  border: 0;
  background: none;
  color: var(--accent);
  text-decoration: underline;
  cursor: pointer;
}

.layout {
  padding-bottom: 48px;
}

.controls {
  display: flex;
  flex-wrap: wrap;
  gap: 8px 12px;
  align-items: center;
  margin-top: 20px;
}

.controls label {
  font-weight: 600;
}

.controls select {
  min-height: 40px;
  min-width: min(100%, 320px);
  padding: 6px 10px;
  border: 1px solid var(--strong-border);
  border-radius: 6px;
  background: var(--raised);
  color: var(--text);
  font: inherit;
}

.tabs {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
  margin-top: 16px;
  border-bottom: 1px solid var(--border);
}

.tab {
  min-height: 44px;
  padding: 10px 14px;
  border: 0;
  border-bottom: 3px solid transparent;
  background: none;
  color: var(--muted);
  font-weight: 600;
  cursor: pointer;
}

.tab[aria-selected='true'] {
  border-bottom-color: var(--accent);
  color: var(--text);
}

.workspace {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 332px;
  gap: 20px;
  align-items: start;
  margin-top: 20px;
}

.panel__heading {
  margin: 0;
  font-size: 1.25rem;
}

.purpose {
  margin: 4px 0 14px;
  color: var(--muted);
}

.note {
  max-width: 78ch;
  margin: 0 0 12px;
  color: var(--muted);
  font-size: 0.9375rem;
}

/* Positioned so visually hidden text inside a table stays within the
   scroller instead of widening the page. */
.scroller {
  position: relative;
  overflow: auto;
  border: 1px solid var(--border);
  border-radius: 10px;
  background: var(--raised);
}

/* ---- relationship types and status ---- */

[data-layer='decision'] {
  --layer: var(--decision);
}

[data-layer='information'] {
  --layer: var(--information);
}

[data-layer='communication'] {
  --layer: var(--communication);
}

[data-layer='neutral'] {
  --layer: var(--muted);
}

.shape {
  flex: none;
  overflow: visible;
}

.shape > * {
  fill: var(--fill);
  stroke: var(--layer);
  stroke-width: 1.8;
}

.shape--recorded {
  --fill: var(--layer);
}

.shape--interpretation {
  --fill: var(--raised);
  stroke-dasharray: 2.6 2;
}

.shape--proposed {
  --fill: var(--raised);
  stroke-dasharray: 0.4 2.8;
  stroke-linecap: round;
}

.shape--proposed > * {
  stroke-width: 2.4;
}

.link {
  fill: none;
  stroke: var(--layer, var(--muted));
  stroke-width: 2;
}

.link--interpretation {
  stroke-dasharray: 7 5;
}

.link--proposed {
  stroke-dasharray: 0.5 6;
  stroke-linecap: round;
  stroke-width: 3;
}

.arrowhead {
  fill: var(--muted);
  fill: context-stroke;
}

.qualified-badge {
  fill: var(--text);
  stroke: var(--raised);
  stroke-width: 1.2;
}

.tag {
  display: inline-block;
  padding: 1px 8px;
  border: 1px solid var(--strong-border);
  border-radius: 12px;
  background: var(--raised);
  color: var(--text);
  font-size: 0.8125rem;
  font-weight: 600;
  line-height: 1.5;
}

.tag--interpretation,
.tag--gap-despiteRoute,
.tag--qualifier-roleMapping {
  border-style: dashed;
}

.passage .tag + .tag {
  margin-left: 4px;
}

.tag--proposed {
  border-width: 2px;
  border-style: dotted;
}

.absence {
  color: var(--muted);
}

[aria-current='true']:is(.mark, .role-button, .relation) {
  border-color: var(--accent);
  background: var(--accent-soft);
  box-shadow: inset 0 0 0 1px var(--accent);
}

/* ---- type picker ---- */

.segmented {
  margin: 0 0 14px;
  padding: 0;
  border: 0;
}

.segmented legend {
  margin-bottom: 6px;
  padding: 0;
  font-size: 0.875rem;
  font-weight: 600;
}

.segmented__options {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}

.segmented__option {
  position: relative;
  display: inline-flex;
  gap: 6px;
  align-items: center;
  min-height: 36px;
  padding: 4px 12px;
  border: 1px solid var(--strong-border);
  border-radius: 999px;
  background: var(--raised);
  cursor: pointer;
}

/* The radio covers its whole option, so a click anywhere on it chooses it. */
.segmented__option input {
  position: absolute;
  inset: 0;
  z-index: 1;
  width: 100%;
  height: 100%;
  margin: 0;
  opacity: 0;
  cursor: pointer;
}

/* No bold: a wider checked option could wrap the row and move the chart. */
.segmented__option:has(input:checked) {
  border-color: var(--accent);
  background: var(--accent-soft);
  box-shadow: inset 0 0 0 1px var(--accent);
}

.segmented__option:has(input:focus-visible) {
  outline: 3px solid var(--accent);
  outline-offset: 2px;
}

/* ---- role orbit ---- */

.zoom {
  display: flex;
  flex-wrap: wrap;
  gap: 8px 12px;
  align-items: center;
  margin: 12px 0;
}

.zoom__label {
  font-weight: 600;
}

.zoom__button {
  min-height: 36px;
  padding: 4px 12px;
  border: 1px solid var(--strong-border);
  border-radius: 999px;
  background: var(--raised);
  cursor: pointer;
}

.zoom__button[aria-disabled='true'] {
  border-style: dashed;
  color: var(--muted);
  cursor: not-allowed;
}

.zoom__count {
  color: var(--muted);
}

.orbit__halves {
  display: grid;
  grid-template-columns: 1fr 1fr;
  margin-bottom: 6px;
  color: var(--muted);
  font-size: 0.875rem;
  font-weight: 600;
}

.orbit__halves p {
  margin: 0;
}

.orbit__halves p + p {
  text-align: right;
}

/* Kept in the layout when unused, so the frame below never moves. */
.orbit__halves.is-hidden {
  visibility: hidden;
}

/* The frame's size never depends on the drawing, and its scroll bars are
   always reserved, so app.js can keep the centre role at one place in it. */
.orbit__frame {
  height: clamp(420px, min(62vw, 100vh - 64px), 700px);
  overflow: scroll;
  border: 1px solid var(--border);
  border-radius: 10px;
  background: var(--raised);
}

.orbit {
  display: block;
}

.orbit__divider {
  stroke: var(--border);
  stroke-dasharray: 2 6;
}

.sat__ring {
  fill: none;
  stroke: transparent;
  stroke-width: 3;
}

.sat.is-selected .sat__ring {
  stroke: var(--accent);
  stroke-width: 2;
}

.sat.is-selected .link {
  stroke-width: 3.5;
}

.rel--spoke:focus-visible .rel__focus {
  stroke-width: 7;
}

.orbit__empty {
  fill: var(--muted);
  font-size: 16px;
}

.svg-label {
  fill: var(--text);
  font-size: 16px;
  paint-order: stroke;
  stroke: var(--raised);
  stroke-width: 4px;
  stroke-linejoin: round;
  pointer-events: none;
}

.svg-label__extra {
  fill: var(--muted);
  font-size: 14px;
  font-style: italic;
}

.core .svg-label {
  font-size: 14px;
}

.core .svg-label__extra {
  font-size: 13px;
}

.line__hit {
  fill: none;
  stroke: transparent;
  stroke-width: 12;
}

.node,
.rel,
.core {
  cursor: pointer;
}

.node:focus,
.rel:focus,
.core:focus {
  outline: none;
}

.node__hit,
.rel__hit {
  fill: transparent;
}

.node__focus,
.rel__focus {
  fill: none;
  stroke: transparent;
}

.node:focus-visible .node__focus,
.rel:focus-visible .rel__focus {
  stroke: var(--text);
  stroke-width: 2.5;
  stroke-dasharray: 4 3;
}

.core__disc {
  fill: var(--accent-soft);
  stroke: var(--accent);
  stroke-width: 2;
}

.core[data-proposed] .core__disc {
  stroke-dasharray: 1 5;
  stroke-linecap: round;
  stroke-width: 3;
}

.core[aria-current='true'] .core__disc {
  stroke-width: 3.5;
}

.core:focus-visible .core__disc {
  stroke: var(--text);
  stroke-width: 4;
  stroke-dasharray: 6 4;
}

/* Re-centring slides nodes to their new places, then lines and marks fade in. */
.orbit.is-recentring [data-node] {
  transition: transform 250ms ease-out;
}

.orbit.is-recentring .rel,
.orbit .is-new {
  animation: orbit-fade 200ms ease-out 150ms both;
}

@keyframes orbit-fade {
  from {
    opacity: 0;
  }
}

@media (prefers-reduced-motion: reduce) {
  .orbit,
  .orbit * {
    transition: none !important;
    animation: none !important;
  }
}

/* ---- who-to-whom matrix ---- */

.matrix caption {
  padding: 12px 14px 4px;
  font-weight: 600;
  text-align: left;
}

.role-button {
  display: inline-flex;
  flex-wrap: wrap;
  gap: 4px 8px;
  align-items: center;
  min-height: 32px;
  padding: 4px 6px;
  border: 1px solid transparent;
  border-radius: 6px;
  background: none;
  font-weight: 600;
  text-align: left;
  cursor: pointer;
}

.mark {
  display: inline-flex;
  gap: 6px;
  align-items: center;
  justify-content: center;
  min-width: 30px;
  min-height: 30px;
  padding: 4px;
  border: 1px solid transparent;
  border-radius: 6px;
  background: none;
  cursor: pointer;
}

/* Sticky first columns: keep focused items clear of them when scrolling. */
.scroller--matrix {
  scroll-padding-left: 150px;
}

.matrix {
  border-collapse: separate;
  border-spacing: 0;
  font-size: 0.875rem;
}

.matrix th,
.matrix td {
  height: 44px;
  padding: 4px;
  border-right: 1px solid var(--border);
  border-bottom: 1px solid var(--border);
  text-align: center;
  vertical-align: middle;
}

.matrix td {
  min-width: 56px;
}

.matrix thead th {
  position: sticky;
  top: 0;
  z-index: 2;
  min-width: 58px;
  max-width: 86px;
  padding: 8px 3px;
  background: var(--surface);
  font-size: 0.75rem;
  font-weight: 600;
  line-height: 1.25;
  vertical-align: bottom;
}

.matrix tbody th {
  position: sticky;
  left: 0;
  z-index: 1;
  min-width: 118px;
  max-width: 150px;
  padding: 6px 8px;
  background: var(--surface);
  font-weight: 600;
  text-align: left;
}

.matrix thead .matrix__corner {
  left: 0;
  z-index: 3;
  color: var(--muted);
  font-size: 0.8125rem;
  font-weight: 400;
  text-align: left;
}

.matrix__label {
  display: block;
}

.matrix__role {
  display: block;
  width: 100%;
  min-height: 0;
  padding: 2px;
  font-weight: 600;
  text-align: inherit;
}

.passage__note {
  margin: 4px 0 6px;
  color: var(--muted);
  font-size: 0.8125rem;
}

.matrix th .tag {
  margin-top: 4px;
  font-size: 0.75rem;
}

.matrix__self {
  background: repeating-linear-gradient(135deg, transparent 0 6px, var(--border) 6px 7px);
}

.matrix .is-current,
.matrix thead th.is-current,
.matrix tbody tr.is-current th {
  background-color: var(--accent-soft);
}

.matrix__agency th,
.matrix__agency td {
  border-bottom: 2px solid var(--strong-border);
}

/* ---- detail panel ---- */

.detail {
  padding: 18px 20px;
  border: 1px solid var(--border);
  border-radius: 10px;
  background: var(--surface);
}

.detail.is-sticky {
  position: sticky;
  top: 16px;
}

.qualifier-note {
  color: var(--muted);
  font-size: 0.875rem;
}

.detail__heading {
  margin: 0 0 8px;
  font-size: 1.125rem;
  line-height: 1.35;
}

.detail h3 {
  margin: 20px 0 8px;
  font-size: 0.9375rem;
}

.detail h4 {
  margin: 12px 0 6px;
  color: var(--muted);
  font-size: 0.8125rem;
}

.detail p {
  margin: 0 0 8px;
}

.tags {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  align-items: center;
}

.passage {
  margin: 0 0 10px;
  padding: 10px 12px;
  border-left: 3px solid var(--strong-border);
  background: var(--raised);
}

.passage .tag {
  margin-bottom: 6px;
}

.passage blockquote {
  margin: 0;
}

.passage figcaption {
  margin-top: 6px;
  color: var(--muted);
  font-size: 0.8125rem;
}

.passage--plan {
  border-left-style: dashed;
}

.relation-list {
  display: grid;
  gap: 4px;
  margin: 0;
  padding: 0;
  list-style: none;
}

.relation {
  display: flex;
  flex-wrap: wrap;
  gap: 4px 8px;
  align-items: center;
  width: 100%;
  min-height: 36px;
  padding: 6px;
  border: 1px solid transparent;
  border-radius: 6px;
  background: none;
  text-align: left;
  cursor: pointer;
}

.relation:hover,
.mark:hover,
.role-button:hover {
  background: var(--accent-soft);
}

.relation__name {
  font-weight: 600;
}

.titles {
  margin: 0;
  padding-left: 1.1rem;
}

.step__label {
  margin: 10px 0 4px;
  color: var(--muted);
  font-size: 0.8125rem;
  font-weight: 600;
}

.paths {
  margin: 0;
  padding-left: 1.25rem;
}

.paths li {
  margin-bottom: 12px;
}

.path__label {
  display: flex;
  flex-wrap: wrap;
  gap: 4px 8px;
  align-items: center;
  font-weight: 600;
}

.path__hops {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
  align-items: center;
}

.empty {
  color: var(--muted);
}

/* ---- legend ---- */

.legend {
  margin-top: 24px;
  padding-top: 16px;
  border-top: 1px solid var(--border);
}

.legend h2 {
  margin: 0 0 8px;
  font-size: 1rem;
}

.legend__items {
  display: flex;
  flex-wrap: wrap;
  gap: 8px 20px;
  margin: 0 0 10px;
  padding: 0;
  list-style: none;
}

.legend__items li {
  display: inline-flex;
  gap: 6px;
  align-items: center;
}

.line-sample {
  overflow: visible;
}

.legend__more summary {
  margin-bottom: 8px;
  color: var(--accent);
  font-size: 0.875rem;
  font-weight: 600;
  cursor: pointer;
}

.legend p {
  max-width: 80ch;
  margin: 4px 0;
  color: var(--muted);
  font-size: 0.875rem;
}

/* The matrix always takes the full layout width so every column shows; the
   detail panel follows the table. */
.workspace[data-view='matrix'] {
  grid-template-columns: minmax(0, 1fr);
}

.workspace[data-view='matrix'] .detail.is-sticky {
  position: static;
}

/* Once a table fits without sideways scrolling, its header row sticks to the
   window. Narrower, the table scrolls inside a frame no taller than the
   window, so its header row and role column both stay in view. */
@media (min-width: 1140px) {
  .scroller--matrix {
    overflow: visible;
  }
}

@media (max-width: 1139px) {
  .scroller--matrix {
    max-height: calc(100vh - 24px);
  }

  /* A header row sticks to its frame, not the window; app.js sets how far the
     page has scrolled past the frame's top so the row stays in the window. */
  .matrix thead th {
    top: var(--past-frame-top, 0px);
  }
}

.scroller--matrix {
  width: fit-content;
  max-width: 100%;
}

.detail .text-button {
  text-align: left;
}

.detail__return {
  display: block;
  margin-bottom: 10px;
}

@media (max-width: 1099px) {
  .workspace {
    grid-template-columns: minmax(0, 1fr);
  }

  .detail.is-sticky {
    position: static;
  }
}

@media (max-width: 600px) {
  .masthead,
  .layout {
    padding-inline: 16px;
  }

  .masthead h1 {
    font-size: 1.5rem;
  }
}

/* Forced colours drop backgrounds and box shadows, so selection and the
   current row are drawn with system-colour outlines. */
@media (forced-colors: active) {
  [aria-current='true']:not(.rel, .core),
  .tab[aria-selected='true'],
  .segmented__option:has(input:checked) {
    outline: 3px solid Highlight;
    outline-offset: 1px;
  }

  .matrix__self {
    forced-color-adjust: none;
    background: repeating-linear-gradient(135deg, Canvas 0 6px, GrayText 6px 7px);
  }

  .matrix .is-current {
    outline: 2px solid Highlight;
    outline-offset: -2px;
  }

  .sat.is-selected .sat__ring,
  .core[aria-current='true'] .core__disc {
    stroke: Highlight;
  }
}

</style>
<style>
.workspace-nav {
  /* The shared tabs keep their colors when the host page changes. */
  --text: light-dark(#0f2140, #e6ebf3);
  --muted: light-dark(#4b5b75, #a8b5c9);
  --accent: light-dark(#1d5bb8, #8db6ff);
  --border: light-dark(#d5dce6, #2b3d5c);
  display: flex;
  gap: 4px;
  margin-bottom: 24px;
  border-bottom: 1px solid var(--border);
}

.workspace-nav a {
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 48px;
  padding: 12px 18px;
  border-bottom: 3px solid transparent;
  color: var(--muted);
  font: 600 15px/1.4 system-ui, -apple-system, 'Segoe UI', sans-serif;
  text-align: center;
  text-decoration: none;
}

.workspace-nav a:hover {
  color: var(--text);
}

.workspace-nav a[aria-current='page'] {
  border-bottom-color: var(--accent);
  color: var(--text);
}

.workspace-nav a:focus-visible {
  outline: 3px solid var(--accent);
  outline-offset: 2px;
}

@media (max-width: 600px) {
  .workspace-nav a {
    flex: 1;
    padding: 10px 8px;
    font-size: 14px;
  }
}

@media (forced-colors: active) {
  .workspace-nav a[aria-current='page'] {
    border-bottom-color: Highlight;
  }
}

</style>
<style>
/* The acceptance-criteria page covers the window when its tab is chosen,
   above Explore's own stacked parts such as pinned table headers. */
#acceptance-frame {
  position: fixed;
  inset: 0;
  z-index: 10;
  width: 100%;
  height: 100%;
  border: 0;
}

html.is-criteria {
  overflow: hidden;
}

<script>
// The view model: the frozen model.js relationships with this gallery's
// supplement applied. Pure functions, no DOM, so the node tests exercise
// exactly what the page renders.
(() => {
  const model = globalThis.responseModel;
  const supplement = globalThis.relationshipSupplement;
  const R = model.relationships;

  const evidence = { ...model.evidence, ...supplement.evidence };
  const edges = [
    ...R.edges.map((edge) => {
      const change = supplement.edges.changed[edge.id];
      return change ? { ...edge, ...change, origin: 'changed' } : edge;
    }),
    ...supplement.edges.added.map((edge) => ({ ...edge, origin: 'added' })),
  ];

  const roles = [R.agency, ...R.nodes];
  const roleById = Object.fromEntries(roles.map((r) => [r.id, r]));
  const edgeById = Object.fromEntries(edges.map((e) => [e.id, e]));
  const order = Object.fromEntries(roles.map((r, i) => [r.id, i]));

  // `basis: 'inferred'` is a wholly reconstructed edge; `inferred` lists the
  // passages whose use on an otherwise recorded edge is our reconstruction.
  function basisOf(edge) {
    if (edge.arrangement === 'proposed') return 'proposed';
    if (edge.basis === 'inferred') return 'reconstructed';
    if (edge.inferred?.length) return 'partlyReconstructed';
    return 'recorded';
  }

  // Readers see one category for everything that depends on our reading; the
  // detail panel still tells a wholly reconstructed relationship from a mixed one.
  const shownBasis = (edge) => ({ reconstructed: 'interpretation', partlyReconstructed: 'interpretation' })[basisOf(edge)] ?? basisOf(edge);

  const passageQualifiers = (id) => evidence[id].qualifiers ?? supplement.passageQualifiers[id] ?? [];
  // Tags for a passage as one edge uses it: its own qualifiers plus role
  // mapping where this edge maps the party the passage names.
  const passageTags = (edge, id) => [...(edge.roleMapping?.includes(id) ? ['roleMapping'] : []), ...passageQualifiers(id)];

  // Qualifiers carried by any cited source activity of a relationship. They
  // describe those activities, not the relationship as a whole.
  const includedQualifiers = (edge) => [...new Set(edge.evidence.flatMap((id) => passageTags(edge, id)))];

  const connectorsOf = (edge) => supplement.connectors[edge.id] ?? [];
  const struckWords = (id) => supplement.markup[id]?.struck ?? [];

  const titleIsMapped = (roleId, title) => supplement.roleTitleMapping[roleId]?.includes(title) ?? false;

  function relationOf(edge, roleId) {
    if (edge.from === roleId) return `${edge.layer}Out`;
    if (edge.to === roleId) return `${edge.layer}In`;
    return null;
  }

  const inLayer = (layer) => (edge) => layer === 'all' || edge.layer === layer;
  const byLayerThenPartner = (roleId) => (a, b) =>
    R.layers.indexOf(a.layer) - R.layers.indexOf(b.layer) ||
    order[a.from === roleId ? a.to : a.from] - order[b.from === roleId ? b.to : b.from];

  function edgesOf(roleId, layer = 'all') {
    return edges.filter((e) => (e.from === roleId || e.to === roleId) && inLayer(layer)(e)).sort(byLayerThenPartner(roleId));
  }

  // Communication edges all end at the agency, so a role has a route out and
  // the agency has routes in; the other direction does not apply.
  function relationsFor(roleId, layer = 'all') {
    const all = ['decisionOut', 'decisionIn', 'informationOut', 'informationIn', roleId === 'agency' ? 'communicationIn' : 'communicationOut'];
    return all.filter((key) => layer === 'all' || key.startsWith(layer));
  }

  function edgesIn(roleId, relation) {
    return edges.filter((e) => relationOf(e, roleId) === relation).sort(byLayerThenPartner(roleId));
  }

  // Roles grouped by modeled relationship distance from one role, counting
  // relationships of the chosen type in either direction: [[root], direct
  // partners, roles two connections away, ...]. Distance only; it is not a
  // procurement sequence.
  function connectionLevels(roleId, layer = 'all') {
    const levels = [[roleId]];
    const seen = new Set(levels[0]);
    while (true) {
      const next = [];
      for (const id of levels.at(-1)) {
        for (const edge of edgesOf(id, layer)) {
          const partner = edge.from === id ? edge.to : edge.from;
          if (seen.has(partner)) continue;
          seen.add(partner);
          next.push(partner);
        }
      }
      if (!next.length) return levels;
      levels.push(next);
    }
  }

  const blackHoleSteps = (roleId) => R.blackHoles.steps.filter((s) => s.node === roleId);

  function gapOf(roleId) {
    const gap = R.gaps.find((g) => g.node === roleId);
    return gap && { ...gap, kind: gap.route === 'recorded' ? 'despiteRoute' : 'noRoute' };
  }

  globalThis.relationshipGraph = {
    layers: R.layers,
    roles,
    edges,
    documents: model.documents,
    statements: model.statements,
    blackHoles: R.blackHoles,
    evidence: (id) => evidence[id],
    role: (id) => roleById[id],
    edge: (id) => edgeById[id],
    order: (id) => order[id],
    basisOf,
    shownBasis,
    passageQualifiers,
    passageTags,
    includedQualifiers,
    connectorsOf,
    struckWords,
    titleIsMapped,
    relationOf,
    edgesOf,
    relationsFor,
    edgesIn,
    connectionLevels,
    blackHoleSteps,
    gapOf,
  };
})();

<script>
(() => {
  const commits = {
    milestones: ['e7a3c19', '2026-09-27', 'Maya Patel', 'feat(notifications): send intake and milestone notices'],
    templates: ['0b84fa2', '2026-09-28', 'Alex Kim', 'feat(notifications): render updates from approved stage templates'],
    delivery: ['c9f281d', '2026-09-28', 'Sam Rivera', 'feat(notifications): persist queued, sent, failed and bounced states'],
    retries: ['a143d8e', '2026-09-28', 'Maya Patel', 'feat(notifications): queue owned retries for failed deliveries'],
    replies: ['7de24b0', '2026-09-29', 'Alex Kim', 'feat(notifications): attach agency replies to the e-req conversation'],
    approvals: ['2f6ac81', '2026-09-29', 'Sam Rivera', 'feat(procurement): link approval evidence to quote revisions'],
    matching: ['9c15ea4', '2026-09-29', 'Maya Patel', 'fix(procurement): reject ambiguous event-to-case matches'],
    recipients: ['4ab829f', '2026-09-29', 'Alex Kim', 'feat(notifications): enforce agency audiences and redact restricted fields'],
    duplicates: ['b83d2f7', '2026-09-30', 'Sam Rivera', 'fix(notifications): block duplicate and conflicting stage notices'],
  };
  const groups = [
    ['Message content', [
      { id: 'title', label: 'Title and e-req number', kind: 'ui', targets: ['ac-title', 'ac-reference'] },
      { id: 'stage', label: 'Current stage and elapsed time', kind: 'ui' },
      { id: 'buyer', label: 'Assigned buyer and current task owner', kind: 'ui' },
      { id: 'contact', label: 'Agency contact', kind: 'ui', targets: ['ac-contact'] },
      { id: 'next-step', label: 'Next step and agency action', kind: 'ui', targets: ['ac-next-step', 'ac-agency-action'] },
      { id: 'next-update', label: 'Next promised update', kind: 'ui', targets: ['ac-next-update'] },
      { id: 'escalation', label: 'Escalation route', kind: 'ui' },
      { id: 'authorization', label: 'Exact quote or scope version', kind: 'ui', targets: ['ac-authorization'] },
      { id: 'executed', label: 'Executed documents when complete', kind: 'ui' },
    ]],
    ['Sending and replies', [
      { id: 'milestones', label: 'Intake and milestone notices', kind: 'code', commit: 'milestones' },
      { id: 'ownership', label: 'Stage and ownership changes', kind: 'code' },
      { id: 'waiting', label: 'Updates during long waits', kind: 'code' },
      { id: 'templates', label: 'Approved templates', kind: 'code', commit: 'templates' },
      { id: 'delivery', label: 'Queued, sent, failed and bounced states', kind: 'code', commit: 'delivery' },
      { id: 'reading', label: 'Delivery kept separate from reading', kind: 'code' },
      { id: 'retries', label: 'Owned failures and retry', kind: 'code', commit: 'retries' },
      { id: 'delivery-test', label: 'Delivery tested before unattended mail', kind: 'code' },
      { id: 'replies', label: 'Replies linked to the case', kind: 'code', commit: 'replies' },
      { id: 'cadence', label: 'Agreed cadence and exceptions', kind: 'code' },
    ]],
    ['Evidence and access', [
      { id: 'source', label: 'Source and last confirmation', kind: 'ui' },
      { id: 'approvals', label: 'Approval backed by evidence', kind: 'code', commit: 'approvals' },
      { id: 'matching', label: 'Reliable case matching', kind: 'code', commit: 'matching' },
      { id: 'onbase', label: 'Buyer recorded in tracker and OnBase', kind: 'code' },
      { id: 'sender', label: 'Approved sender and mailbox access', kind: 'code' },
      { id: 'recipients', label: 'Authorized recipients and restricted detail', kind: 'code', commit: 'recipients' },
      { id: 'duplicates', label: 'No duplicate or conflicting notices', kind: 'code', commit: 'duplicates' },
      { id: 'accessibility', label: 'Accessible content and documents', kind: 'code' },
      { id: 'live-scope', label: 'Live email scope agreed with OIT', kind: 'code' },
    ]],
  ];
  const items = new Map(groups.flatMap((group) => group[1]).map((item) => [item.id, item]));
  const list = document.getElementById('criteria-groups');
  const status = document.getElementById('acceptance-status');
  const returnButton = document.getElementById('criterion-return');
  let activeId = null;
  let hoveredId = null;
  let hideTimer;
  const reducedMotion = () => matchMedia('(prefers-reduced-motion: reduce)').matches;

  function element(tag, className, text) {
    const el = document.createElement(tag);
    if (className) el.className = className;
    if (text) el.textContent = text;
    return el;
  }
  function commitCard(item) {
    const [hash, date, author, message] = commits[item.commit];
    const card = element('div', 'commit-tooltip');
    card.id = 'commit-' + item.id;
    card.setAttribute('role', 'tooltip');
    card.dataset.commit = hash;
    card.hidden = true;
    card.append(element('p', 'commit-label', 'Fictional commit · demo evidence'), element('code', 'commit-hash', hash), element('p', 'commit-message', message));
    const details = element('dl');
    for (const pair of [['Date', date], ['Author', author]]) details.append(element('dt', '', pair[0]), element('dd', '', pair[1]));
    card.append(details);
    return card;
  }
  for (const [name, entries] of groups) {
    const section = element('section', 'criteria-group');
    const heading = element('h3', '', name);
    const ul = element('ul', 'criteria-list');
    section.append(heading, ul);
    for (const item of entries) {
      const done = Boolean(item.targets || item.commit);
      const row = element('li', 'criterion');
      row.dataset.criterion = item.id;
      row.dataset.status = done ? 'done' : 'open';
      row.dataset.kind = item.kind;
      if (item.targets) row.dataset.highlights = item.targets.join(' ');
      const button = element('button', 'criterion-button');
      button.type = 'button';
      button.id = 'criterion-' + item.id;
      if (item.targets) button.setAttribute('aria-controls', item.targets.join(' '));
      const check = element('span', 'check', done ? '✓' : '');
      check.setAttribute('aria-hidden', 'true');
      const badge = element('span', 'criterion-state', done ? (item.kind === 'ui' ? 'In email' : 'Demo commit') : 'Open');
      button.setAttribute('aria-label', item.label + ', ' + badge.textContent + (done ? ', complete in this example' : ''));
      button.append(check, element('span', '', item.label), badge);
      button.addEventListener('focus', () => {
        activate(item.id);
        if (item.commit &amp;&amp; button.matches(':focus-visible')) showCommit(item.id);
      });
      button.addEventListener('click', () => activate(item.id, true));
      row.append(button);
      if (item.commit) {
        row.append(commitCard(item));
        row.addEventListener('pointerenter', () => {
          clearTimeout(hideTimer);
        });
        // Scrolling a row under a stationary pointer is not a request to preview it.
        row.addEventListener('pointermove', (event) => {
          if (event.pointerType === 'touch' || hoveredId === item.id) return;
          hoveredId = item.id;
          showCommit(item.id);
        });
        row.addEventListener('pointerleave', () => {
          if (hoveredId === item.id) hoveredId = null;
          // Keep the tooltip reachable across the gap between it and its row.
          hideTimer = setTimeout(() => {
            if (!button.matches(':focus-visible')) hideCommit(item.id);
          }, 150);
        });
        button.addEventListener('blur', () => {
          if (!row.matches(':hover')) hideCommit(item.id);
        });
      }
      ul.append(row);
    }
    list.append(section);
  }
  for (const item of items.values()) {
    for (const id of item.targets ?? []) {
      const target = document.getElementById(id);
      target.setAttribute('aria-controls', 'criterion-' + item.id);
      target.addEventListener('click', () => {
        activate(item.id);
        const button = document.getElementById('criterion-' + item.id);
        status.textContent = 'Highlighted acceptance criterion: ' + item.label + '.';
        const box = button.getBoundingClientRect();
        if (box.top < 0 || box.bottom > innerHeight) button.scrollIntoView({ block: 'center', behavior: reducedMotion() ? 'auto' : 'smooth' });
        button.focus({ preventScroll: true });
      });
    }
  }
  function placeTooltip(card, button) {
    const box = button.getBoundingClientRect();
    const width = card.offsetWidth;
    const height = card.offsetHeight;
    const beside = box.left >= width + 32;
    const left = beside ? box.left - width - 12 : Math.max(16, Math.min(box.left, innerWidth - width - 16));
    const below = box.bottom + 10;
    const top = beside ? Math.max(16, Math.min(box.top, innerHeight - height - 16)) : below + height <= innerHeight - 16 ? below : Math.max(16, box.top - height - 10);
    card.style.left = left + 'px';
    card.style.top = top + 'px';
  }
  function hideCommit(id) {
    clearTimeout(hideTimer);
    const cards = id ? [document.getElementById('commit-' + id)] : document.querySelectorAll('[data-commit]');
    cards.forEach((card) => {
      card.hidden = true;
      card.closest('[data-criterion]').querySelector('button').removeAttribute('aria-describedby');
    });
  }
  function showCommit(id) {
    hideCommit();
    const button = document.getElementById('criterion-' + id);
    const card = document.getElementById('commit-' + id);
    card.hidden = false;
    button.setAttribute('aria-describedby', card.id);
    placeTooltip(card, button);
  }
  function clearSelection() {
    document.querySelectorAll('.is-highlighted').forEach((el) => el.classList.remove('is-highlighted'));
    document.querySelectorAll('.criterion-button').forEach((el) => {
      el.removeAttribute('aria-current');
    });
    returnButton.hidden = true;
    activeId = null;
  }
  function clear() {
    hideCommit();
    clearSelection();
  }
  function activate(id, reveal = false) {
    if (id !== activeId) {
      clearSelection();
      const card = document.querySelector('[data-commit]:not([hidden])');
      if (card?.id !== 'commit-' + id) hideCommit();
    }
    activeId = id;
    const item = items.get(id);
    const row = document.querySelector('[data-criterion=&quot;' + id + '&quot;]');
    const button = row.querySelector('button');
    button.setAttribute('aria-current', 'true');
    let announcement;
    if (item.targets) {
      const targets = item.targets.map((target) => document.getElementById(target));
      targets.forEach((target) => target.classList.add('is-highlighted'));
      announcement = 'Highlighted ' + item.label + ' in the email.';
      if (reveal) {
        const box = targets[0].getBoundingClientRect();
        if (box.top < 0 || box.bottom > innerHeight) {
          returnButton.hidden = false;
          targets[0].scrollIntoView({ block: 'center', behavior: reducedMotion() ? 'auto' : 'smooth' });
          targets[0].focus({ preventScroll: true });
        }
      }
    } else if (item.commit) {
      announcement = item.label + ' has fictional demo evidence. Pointer hover or keyboard focus shows the commit details.';
    } else {
      announcement = item.label + ' is open. No implementation evidence yet.';
    }
    if (reveal) status.textContent = announcement;
  }
  returnButton.addEventListener('click', () => {
    const button = document.getElementById('criterion-' + activeId);
    returnButton.hidden = true;
    button.scrollIntoView({ block: 'center', behavior: reducedMotion() ? 'auto' : 'smooth' });
    button.focus({ preventScroll: true });
  });
  document.addEventListener('keydown', (event) => {
    if (event.key === 'Escape') clear();
  });
  document.addEventListener('click', (event) => {
    if (!event.target.closest('.criterion') &amp;&amp; event.target !== returnButton &amp;&amp; !event.target.closest('[data-email-target]')) clear();
  });
  window.addEventListener('scroll', () => {
    const card = document.querySelector('[data-commit]:not([hidden])');
    if (card) placeTooltip(card, card.closest('[data-criterion]').querySelector('button'));
  }, { passive: true });
  window.addEventListener('resize', () => {
    const card = document.querySelector('[data-commit]:not([hidden])');
    if (card) placeTooltip(card, card.closest('[data-criterion]').querySelector('button'));
  });
  activate('title');
})();
</script>

<script>
(() => {
  const pages = { '#explore': 'explore', '#criteria': 'criteria' };
  const frame = document.getElementById('acceptance-frame');
  const app = document.getElementById('app');
  let exploreHash = '';
  let exploreTitle = '';
  function show(page, { focus = true } = {}) {
    const chosen = page === 'criteria';
    frame.hidden = !chosen;
    app.inert = chosen;
    document.documentElement.classList.toggle('is-criteria', chosen);
    document.title = chosen ? frame.title : exploreTitle;
    // Explore's chart measures its frame, which may have changed while covered.
    if (!chosen) dispatchEvent(new Event('resize'));
    // The reader arrives on the chosen page's own current tab.
    const doc = chosen ? frame.contentDocument : document;
    if (focus) doc?.querySelector('.workspace-nav a[aria-current="page"]')?.focus();
  }
  addEventListener('hashchange', (event) => {
    const page = pages[location.hash];
    if (!page) return;
    event.stopImmediatePropagation();
    const before = new URL(event.oldURL).hash;
    if (page === 'criteria') {
      if (!pages[before]) exploreHash = before;
    } else {
      history.replaceState(null, '', exploreHash || location.pathname);
    }
    show(page);
  });
  globalThis.prototypePages = {
    initial: pages[location.hash] ?? 'explore',
    start() {
      exploreTitle = document.title;
      // Explore's tabs point at this file's own fragments.
      for (const [href, hash] of [['index.html', '#explore'], ['email/notification-mockup.html', '#criteria']]) {
        const link = document.querySelector(`.workspace-nav a[href="${href}"]`);
        if (!link) throw new Error(`Explore has no tab for ${href}`);
        link.setAttribute('href', hash);
      }
      if (this.initial === 'criteria') {
        exploreHash = location.hash;
        history.replaceState(null, '', '#criteria');
        show('criteria', { focus: false });
      }
    },
  };
})();
